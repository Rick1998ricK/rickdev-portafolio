name: Deploy a SiteGround

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Deploy via FTP a SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.rickdev.net.pe
          username: ftp-host@rickdev.net.pe
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
          dangerous-clean-slate: false